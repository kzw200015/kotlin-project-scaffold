server:
  addr: ":8080"
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 15s
  # 反向代理写入真实客户端 IP 的请求头（代理须覆盖该头），留空则使用 RemoteAddr
  client_ip_header: ""

database:
  # 可用环境变量 APP_DATABASE_DSN 覆盖
  dsn: "postgres://postgres:postgres@localhost:5432/app?sslmode=disable"
  max_conns: 10
  min_conns: 0
  max_conn_lifetime: 1h
  # 启动时自动执行 goose up（生产环境建议关闭，改用 make migrate-up）
  auto_migrate: true

log:
  level: debug
  format: text
