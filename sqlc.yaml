version: "2"

# 每个领域一个条目：查询 SQL 与生成代码放在领域内的 db 子包（internal/<domain>/db）。
# schema 统一指向 migrations（sqlc 能识别 goose 的 Up/Down 注释，只读取 Up 部分）。
# 新增领域时追加一个条目，用 `<<: *go` 复用公共选项：
#
#   - engine: "postgresql"
#     schema: "migrations"
#     queries: "internal/order/db/queries.sql"
#     gen:
#       go:
#         <<: *go
#         out: "internal/order/db"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/user/db/queries.sql"
    gen:
      go: &go
        package: "db"
        out: "internal/user/db"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        json_tags_case_style: "snake"
        omit_unused_structs: true # 只生成本领域查询用到的模型
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
