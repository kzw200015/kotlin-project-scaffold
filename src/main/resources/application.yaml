spring:
  application:
    name: scaffold
  threads:
    virtual:
      enabled: true
  # 默认指向本地库；连开发库时用环境变量覆盖：SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
  datasource:
    url: jdbc:postgresql://localhost:5432/app
    username: postgres
    password: postgres

app:
  jwt:
    # HS256 签名密钥，至少 32 字节，不设默认值，必须用环境变量 APP_JWT_SECRET 提供（生成：openssl rand -base64 48）
    secret: ${APP_JWT_SECRET}
    ttl: 2h

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 按构造参数名映射列（依赖 javaParameters 编译选项），Kotlin data class 无需无参构造
    arg-name-based-constructor-auto-mapping: true
