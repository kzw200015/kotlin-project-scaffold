spring:
  application:
    name: scaffold
  threads:
    virtual:
      enabled: true
  # 默认指向本地库；连开发库时用环境变量覆盖：SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
  datasource:
    url: jdbc:postgresql://localhost:5432/app
    username: postgres
    password: postgres
  # 存放登录会话。默认指向本地；用环境变量覆盖：SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT / SPRING_DATA_REDIS_PASSWORD
  data:
    redis:
      host: localhost
      port: 6379
      # 只用 StringRedisTemplate，没有 Redis Repository，不需要扫描
      repositories:
        enabled: false

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 按构造参数名映射列（依赖 javaParameters 编译选项），Kotlin data class 无需无参构造
    arg-name-based-constructor-auto-mapping: true
